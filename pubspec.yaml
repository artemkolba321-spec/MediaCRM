name: media_crm
description: MediaCRM — offline-first workspace for managing a creator media network.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.4
  intl: ^0.20.3
  url_launcher: ^6.3.1
  http: ^1.3.0
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  collection: ^1.19.0
  file_picker: ^8.3.2
  csv: ^6.0.0
  crypto: ^3.0.6
  flutter_dotenv: ^6.0.1
  json_annotation: ^4.9.0
  http_parser: ^4.1.2
  timezone: ^0.10.1
  flutter_slidable: ^3.1.2
  table_calendar: ^3.2.0
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
